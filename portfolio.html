<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pageTitle">시공사례 | 동아광고</title>
<meta name="description" id="pageDesc" content="동아광고 시공사례">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .detail-hero{position:relative;height:56vh;min-height:340px;background:var(--dark);margin-top:0}
  .detail-hero img{width:100%;height:100%;object-fit:cover}
  .detail-hero .hero-placeholder{position:absolute;inset:0}
  .detail-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.65));display:flex;align-items:flex-end}
  .detail-hero-info{padding:40px 0;color:#fff}
  .detail-hero-info .tag{display:inline-block;background:var(--accent);padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:14px}
  .detail-hero-info h1{font-size:clamp(24px,4vw,38px);font-weight:800}
  .detail-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:44px 0;border-bottom:1px solid var(--line)}
  .detail-meta dt{font-size:12px;font-weight:700;color:var(--ink-faint);letter-spacing:.06em;margin-bottom:8px}
  .detail-meta dd{margin:0;font-size:16px;font-weight:700}
  .process-mini{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:36px 0;font-size:13px;font-weight:700;color:var(--ink-soft)}
  .process-mini span.step{padding:8px 16px;border:1px solid var(--line);border-radius:999px}
  .process-mini span.arrow{color:var(--ink-faint)}
  .ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px 0 44px}
  .ba-item{border-radius:var(--radius);overflow:hidden;background:var(--paper-soft);aspect-ratio:4/3;position:relative}
  .ba-item img{width:100%;height:100%;object-fit:cover}
  .ba-label{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}
  @media (max-width:680px){.ba-grid,.detail-meta{grid-template-columns:1fr}}
  .desc-block{padding:8px 0 44px;font-size:15.5px;color:var(--ink-soft);line-height:1.9;max-width:760px}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink-soft);margin:100px 0 0}

  /* Before/After 드래그 비교 슬라이더 */
  .compare-slider{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;max-width:460px;margin:20px 0 10px;background:#111;touch-action:pan-y;user-select:none}
  .compare-base,.compare-top{position:absolute;inset:0;width:100%;height:100%}
  .compare-top{clip-path:inset(0 50% 0 0)}
  .compare-slider img{width:100%;height:100%;object-fit:cover;display:block}
  .compare-slider .hero-placeholder{position:absolute;inset:0}
  .compare-label{position:absolute;top:14px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;background:rgba(0,0,0,.55);padding:5px 12px;border-radius:999px;z-index:2}
  .compare-label.before{left:14px}
  .compare-label.after{right:14px}
  .compare-divider{position:absolute;top:0;bottom:0;width:2px;left:50%;background:#fff;transform:translateX(-1px);z-index:3;pointer-events:none}
  .compare-handle{position:absolute;top:50%;left:50%;width:44px;height:44px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:4;cursor:ew-resize}
  .compare-handle svg{width:18px;height:18px;color:var(--ink)}
  .compare-hint{text-align:center;font-size:12px;color:var(--ink-faint);margin:0 0 20px;display:flex;align-items:center;justify-content:center;gap:6px}
  .compare-hint svg{width:14px;height:14px}

  /* Mobile 하단 고정 CTA (탭바 대신 - 상세페이지는 문의 액션 하나에 집중) */
  .detail-mobile-cta{display:none;position:fixed;left:0;right:0;bottom:0;z-index:900;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px -12px rgba(0,0,0,.25)}
  .detail-mobile-cta a{display:flex;align-items:center;justify-content:center;height:48px;border-radius:2px;background:var(--accent);color:#fff;font-weight:700;font-size:14.5px}
  @media (max-width:780px){
    .detail-mobile-cta{display:block}
    .back-link{margin-top:88px}
  }
</style>
</head>
